services:
  web:
    build: .
    image: wardweek-safe-publish:latest
    ports:
      - "8000:8000"
    environment:
      DB_PATH: /data/app.db
    volumes:
      - app_data:/data          # SQLite 持久化：重启后已发布表仍可查看
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  app_data:
